[project]
name = "quirk"
version = "0.1.0"
description = "DAG-backed quantum circuits and statevector simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "graphviz>=0.21",
    "numpy>=2.2.6",
    "rustworkx>=0.17.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quirk"]

[tool.hatch.build.targets.sdist]
include = ["quirk/", "tests/", "pyproject.toml", "README.md", "API.md", "REFACTOR.md", "LICENSE", "main.py", "examples.py"]
